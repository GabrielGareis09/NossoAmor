<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nosso Amor ❤️</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="hearts"></div>

    <main class="container">

        <div class="heart-icon">♥</div>

        <h1>Nosso Amor</h1>

        <p class="subtitle">
            Uma história que começou com nós dois...
        </p>

        <div class="login-box">

            <p class="login-text">
                Para entrar, digite o dia que se conhecemos (dois digitos).
            </p>

            <div class="input-container">
                <span>♡</span>

                <input type="password" id="password" placeholder="Nossa palavra..." autocomplete="off">
            </div>

            <button id="enterButton">
                Entrar na nossa história
                <span>→</span>
            </button>

            <p id="errorMessage" class="error-message"></p>

        </div>

        <p class="footer">
            Feito com amor, para você. ❤️
        </p>

    </main>

    <script src="index.js"></script>

</body>

</html>
